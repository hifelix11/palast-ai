name: palast
description: Palast — your mind palast. A personal AI-native knowledge organizer.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0
  go_router_builder: ^2.7.0

  # Backend
  supabase_flutter: ^2.5.6

  # Auth
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1

  # Analytics & monitoring
  posthog_flutter: ^4.7.1
  sentry_flutter: ^8.6.0

  # Capture
  receive_sharing_intent: ^1.8.1
  record: ^5.1.2

  # Local cache
  drift: ^2.18.0

  # Env
  envied: ^0.5.4+1

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Utilities
  path_provider: ^2.1.3
  path: ^1.9.0
  uuid: ^4.4.0
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  share_plus: ^9.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Codegen
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  riverpod_lint: ^2.3.10
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0
  envied_generator: ^0.5.4+1

  # Lints & testing
  very_good_analysis: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
