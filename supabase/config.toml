project_id = "palast"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://palast.ai"
additional_redirect_urls = ["ai.palast.app://login-callback"]
jwt_expiry = 3600
enable_signup = true

[auth.external.google]
enabled = true
# client_id and secret set via supabase secrets

[auth.external.apple]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.process-item]
verify_jwt = true

[functions.transcribe-audio]
verify_jwt = true
